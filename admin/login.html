<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Espacios 360</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon" style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3AACDC,#1A2B5F);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
        <span style="color:#fff;font-weight:800;font-size:16px">360</span>
      </div>
      <h1>Espacios 360</h1>
      <p>Panel de administración</p>
    </div>

    <div class="demo-note" id="demoNote">
      <i class="fa-solid fa-circle-info"></i>
      <strong>Modo demo</strong> — Usa cualquier correo y la contraseña <code>admin360</code>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" class="form-input" placeholder="admin@espacios360.mx" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div style="position:relative">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required style="padding-right:44px">
          <button type="button" id="togglePwd" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gray-400)">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <p class="error-msg" id="errorMsg"><i class="fa-solid fa-triangle-exclamation"></i> <span id="errorText"></span></p>
      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnText">Iniciar sesión</span>
        <i class="fa-solid fa-spinner fa-spin" id="btnSpinner" style="display:none"></i>
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:.8rem;color:var(--gray-400)">
      <a href="../index.html" style="color:var(--sky)">← Volver al sitio</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/admin.js"></script>
<script>
  // Hide demo note when not in demo mode
  if (!DEMO_MODE) document.getElementById('demoNote').style.display = 'none';

  // Redirect if already logged in
  (async () => {
    if (await isAdminLoggedIn()) window.location.href = 'dashboard.html';
  })();

  // Toggle password visibility
  document.getElementById('togglePwd').addEventListener('click', () => {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fa-regular fa-eye-slash'; }
    else { pwd.type = 'password'; icon.className = 'fa-regular fa-eye'; }
  });

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('errorMsg');
    const spinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');

    errEl.classList.remove('show');
    spinner.style.display = 'inline-block';
    btnText.textContent = 'Ingresando...';
    document.getElementById('btnLogin').disabled = true;

    const result = await adminLogin(email, password);

    spinner.style.display = 'none';
    document.getElementById('btnLogin').disabled = false;
    btnText.textContent = 'Iniciar sesión';

    if (result.ok) {
      window.location.href = 'dashboard.html';
    } else {
      document.getElementById('errorText').textContent = result.message || 'Error al iniciar sesión';
      errEl.classList.add('show');
    }
  });
</script>
</body>
</html>
